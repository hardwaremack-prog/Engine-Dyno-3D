<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engine dyno 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#e6e9e2;--panel:#eef0ea;--ink:#16202b;--mute:#5b6770;--line:#b7bfb6;--pw:#c2185b;--red:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171c;--panel:#192129;--ink:#e3e8e1;--mute:#93a0a8;--line:#2f3b44;--pw:#ff5c9a;--red:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171c;--panel:#192129;--ink:#e3e8e1;--mute:#93a0a8;--line:#2f3b44;--pw:#ff5c9a;--red:#ff6b5e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 48px}
h1{font:700 34px/1 'Barlow Condensed',Impact,sans-serif;margin:0 0 6px}
p{margin:0;color:var(--mute)}
#list{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;padding-bottom:4px}
#list button{all:unset;cursor:pointer;flex:0 0 auto;min-width:150px;padding:8px 12px;background:var(--panel);border-left:5px solid var(--line);border-radius:2px}
#list button[aria-checked="true"]{border-left-color:var(--pw)}
#list b{display:block;font:700 19px/1.1 'Barlow Condensed',Impact,sans-serif}
#list span{font-size:13px;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pw);outline-offset:2px}
#c{display:block;width:100%;height:66vh;min-height:400px;background:var(--panel);border-radius:2px;touch-action:none;cursor:grab}
.read{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.read div{background:var(--panel);padding:6px 8px 4px;border-radius:2px}
.read output{display:block;font:700 24px/1 'Barlow Condensed',Impact,sans-serif;font-variant-numeric:tabular-nums}
.read small{color:var(--mute);font-size:12px}
.strain{margin-top:10px;font-size:14px;color:var(--mute)}
.strain div{height:10px;background:var(--panel);border-radius:2px;overflow:hidden;margin-bottom:4px}
.strain i{display:block;height:100%;width:0;background:var(--red)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ctl label{grid-column:1/-1;display:block;font-size:14px;color:var(--mute)}
.ctl input[type=range]{width:100%;accent-color:var(--pw);margin-top:6px}
.btn{all:unset;box-sizing:border-box;text-align:center;cursor:pointer;padding:14px 10px;font:700 20px/1 'Barlow Condensed',Impact,sans-serif;background:var(--ink);color:var(--bg);border-radius:2px;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.alt{background:var(--panel);color:var(--ink);border:2px solid var(--ink)}
.btn.on{background:var(--red);color:#fff}
.btn.sel{background:var(--pw);color:#fff;border-color:var(--pw)}
.row{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.row.c3{grid-template-columns:repeat(3,1fr)}
.row .btn{padding:10px 4px;font-size:18px}
#stage{position:relative}.ov{position:absolute}
#shifter{width:132px;height:132px;color:var(--ink);background:color-mix(in srgb,var(--panel) 82%,transparent);border-radius:6px;touch-action:none;cursor:grab}
#shifter svg{width:100%;height:100%;display:block}
#pbox{display:grid;gap:6px;justify-items:end}
#ped{position:relative;width:64px;height:140px;background:color-mix(in srgb,var(--panel) 82%,transparent);border:2px solid var(--ink);border-radius:6px;overflow:hidden;touch-action:none;cursor:ns-resize}
#pfill{position:absolute;bottom:0;left:0;right:0;height:0;background:var(--pw)}
#ped span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 14px 'Barlow Condensed',sans-serif;color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Engine dyno</h1>
  <p>Drag to orbit, pinch or scroll to zoom. Use the shifter and throttle pedal on the view.</p>
  <section id="list" role="radiogroup" aria-label="Engine"></section>
  <div id="stage"><canvas id="c" aria-label="3D engine"></canvas>
    <button class="btn ov" id="start" style="left:10px;top:10px">Start engine</button>
    <div class="ov" id="shifter" style="left:10px;bottom:10px"><svg viewBox="0 0 132 132"><path d="M26 26V106M66 26V106M106 26V66M26 66H106" stroke="currentColor" stroke-width="3" fill="none" opacity=".45"/><g font-size="13" fill="currentColor" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700"><text x="26" y="16">1</text><text x="26" y="124">2</text><text x="66" y="16">3</text><text x="66" y="124">4</text><text x="106" y="16">5</text><text x="66" y="86">N</text></g><g id="knob" transform="translate(66 66)"><circle r="13" fill="var(--pw)"/></g></svg></div>
    <div class="ov" id="pbox" style="right:10px;bottom:10px"><button class="btn alt" id="plock" style="padding:6px 10px;font-size:16px">Lock</button><div id="ped"><i id="pfill"></i><span>Throttle</span></div></div>
  </div>
  <div class="read">
    <div><output id="rRpm">0</output><small>rpm</small></div>
    <div><output id="rHp">0</output><small>hp</small></div>
    <div><output id="rTq">0</output><small>lb-ft</small></div>
    <div><output id="rBo">–</output><small>boost psi</small></div>
    <div><output id="rMph">0</output><small>mph</small></div>
  </div>
  <div class="strain"><div><i id="sBar"></i></div><span id="sTxt"></span></div>
  <div class="strain"><span id="rpmTxt"></span></div>
  <section class="ctl">
    <button class="btn alt" id="rev" style="grid-column:1/-1">Hold to rev (or press space)</button>
    <label>Camera</label>
    <div class="row" style="grid-template-columns:1fr 1fr"><button class="btn alt" id="zf">Whole engine</button><button class="btn alt" id="zr">Replay engine start</button><button class="btn alt" id="zc">Valve close-up</button><button class="btn alt" id="zs">Starter close-up</button></div>
    <label>Animation speed (real time follows the true rpm)</label>
    <div class="row c3"><button class="btn alt sel" data-s="1">Real time</button><button class="btn alt" data-s=".1">1/10 speed</button><button class="btn alt" data-s=".01">1/100 speed</button></div>
    <label>Oil level: <output id="oilv"></output> <input type="range" id="oil" min="0" max="150" value="100"></label>
    <div class="row c3">
      <button class="btn alt" data-oil="0">Drain oil</button>
      <button class="btn alt" data-oil="100">Fill to full</button>
      <button class="btn alt" data-oil="145">Overfill</button>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),R2=Math.PI/180,sst=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const E=[
 {name:'Inline-6 twin turbo',sp:'3.0 L, 640 hp',hp:640,red:7200,idle:850,tqPk:4800,width:3600,boost:26,spool:[2000,3600],lag:.7,rev:1,order:[1,5,3,6,2,4],cycle:720,ppr:3,snd:{p:1.15,odd:.75,cut:2400,vol:1},b:[0],n:6,ph:[0,240,120,120,240,0],tu:2},
 {name:'Flat-plane V8',sp:'5.5 L, 670 hp',hp:670,red:8600,idle:900,tqPk:6800,width:4200,boost:0,rev:1,order:[1,5,4,8,6,3,7,2],cycle:720,ppr:4,snd:{p:.95,odd:.95,cut:3600,vol:.9},b:[-45,45],n:4,ph:[0,90,270,180],tu:0},
 {name:'Three-rotor Wankel',sp:'2.0 L, 420 hp',hp:420,red:9000,idle:1000,tqPk:6500,width:5000,boost:14,spool:[2500,4500],lag:.6,rev:1.5,order:[1,2,3],cycle:1080,ppr:3,snd:{p:.6,odd:1,cut:5200,vol:.7},b:[0],n:3,rot:1,tu:2},
 {name:'Turbo boxer-four',sp:'2.5 L, 330 hp',hp:330,red:6700,idle:800,tqPk:4200,width:3000,boost:20,spool:[2200,3800],lag:.8,rev:1.1,order:[1,3,2,4],cycle:720,ppr:2,snd:{p:1.25,odd:.6,cut:2000,vol:1},b:[-90,90],n:2,ph:[0,180],flat:1,tu:1},
 {name:'V12',sp:'6.5 L, 725 hp',hp:725,red:9000,idle:900,tqPk:7000,width:4500,boost:0,rev:.8,order:[1,7,5,11,3,9,6,12,2,8,4,10],cycle:720,ppr:6,snd:{p:.85,odd:.9,cut:4200,vol:.85},b:[-30,30],n:6,ph:[0,240,120,120,240,0],tu:0}
];
[[1.9,1.05],[1.5,0],[1.6,1.4],[1,0],[1.95,0]].forEach((m,i)=>E[i].im=m);E[1].v4=1;
const tq=(e,r,b)=>e.k*Math.max(.4,1-((r-e.tqPk)/e.width)**2)*(1+.9*b/14.7);
for(const e of E){e.k=1;let m=0;const bo=r=>e.boost?e.boost*sst(e.spool[0],e.spool[1],r):0;for(let r=1000;r<=e.red;r+=100)m=Math.max(m,tq(e,r,bo(r))*r/5252);e.k=e.hp/m}
const NI=[11,15,19,22,26],NO=[33,29,25,22,18],GR=NO.map((n,i)=>n/NI[i]),M=.0375;
let cur=E[0],running=false,starting=0,rpm=0,thr=0,prevThr=0,boost=0,cut=false,revHeld=false,va=0,vis=0,gear=0,oil=100,LIM=45,SLO=1,TRPM=0;
let dead=false,strain=0,shk=0,flash=0,hpNow=0,tqNow=0,foul=[],fs=[],avgF=0,mf=false,ts=0,proj=null,PR=[];

/* ---------- audio ---------- */
let AC,o1,o2,filt,gain,wh,whg,sw,swg,noise;
function setWave(){if(!AC)return;const n=24,re=new Float32Array(n+1),im=new Float32Array(n+1),s=cur.snd;for(let i=1;i<=n;i++)im[i]=(1/Math.pow(i,s.p))*(i%2?1:s.odd);const w=AC.createPeriodicWave(re,im);o1.setPeriodicWave(w);o2.setPeriodicWave(w)}
function initAudio(){
  if(AC){AC.resume();return}
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain();master.gain.value=.5;
  const sh=AC.createWaveShaper(),cv=new Float32Array(256);for(let i=0;i<256;i++)cv[i]=Math.tanh((i/127.5-1)*2);sh.curve=cv;
  filt=AC.createBiquadFilter();filt.type='lowpass';filt.Q.value=1.2;
  gain=AC.createGain();gain.gain.value=0;o1=AC.createOscillator();o2=AC.createOscillator();
  o1.connect(gain);o2.connect(gain);gain.connect(sh);sh.connect(filt);filt.connect(master);master.connect(AC.destination);
  wh=AC.createOscillator();whg=AC.createGain();whg.gain.value=0;wh.connect(whg);whg.connect(master);
  sw=AC.createOscillator();sw.type='sawtooth';swg=AC.createGain();swg.gain.value=0;sw.connect(swg);swg.connect(master);

  setWave();
}
function puff(hz,v,d){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=hz;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}

  const t=AC.currentTime,s=AC.createBufferSource(),lp=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noise;s.loop=true;lp.type='lowpass';lp.frequency.setValueAtTime(2500,t);lp.frequency.exponentialRampToValueAtTime(120,t+1.8);
  g.gain.setValueAtTime(1.1,t);g.gain.exponentialRampToValueAtTime(.001,t+2);s.connect(lp);lp.connect(g);g.connect(AC.destination);s.start();s.stop(t+2.1);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(30,t+.8);
  og.gain.setValueAtTime(1,t);og.gain.exponentialRampToValueAtTime(.001,t+1);o.connect(og);og.connect(AC.destination);o.start();o.stop(t+1.1);

function audio(){
  if(!AC)return;
  const t=AC.currentTime,e=cur,f=Math.max(1,rpm/60*e.ppr),jit=(Math.random()-.5)*.012*(1-thr);
  o1.frequency.setTargetAtTime(f*(1+jit),t,.02);o2.frequency.setTargetAtTime(f*1.004,t,.02);
  filt.frequency.setTargetAtTime(e.snd.cut*(.35+.9*(rpm/e.red)*(.4+.6*thr)),t,.04);
  gain.gain.setTargetAtTime(running?(.12+.5*thr)*.5*e.snd.vol*(cut?.35:1)*(mf?.1:1)*(oil<4?1.2:1):0,t,.03);

  sw.frequency.setTargetAtTime(160+rpm*.6,t,.05);swg.gain.setTargetAtTime(starting>0?.05:0,t,.05);
}

/* ---------- simulation ---------- */
function blow(){
  dead=true;running=false;strain=LIM;shk=14;flash=1;

    emit('f',new THREE.Vector3((Math.random()-.5)*cur.len,.6,(Math.random()-.5)*1.4),v,.5+Math.random()*.8,.3+Math.random()*.4,0xffaa33)}
  for(let i=0;i<45;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()*.8,Math.random()-.5).normalize().multiplyScalar(4+Math.random()*10);
    emit('d',new THREE.Vector3((Math.random()-.5)*cur.len,.6,0),v,3,.08+Math.random()*.15,0x222222)}

}
function step(dt){
  const e=cur,tgt=Math.max(pedal,revHeld?1:0);oil=+$('#oil').value;
  prevThr=thr;thr+=(tgt-thr)*Math.min(1,dt*12);LIM=5+40*Math.min(1,oil/90);
  const ov=Math.max(0,(oil-110)/40);
  foul.forEach((f,i)=>{const t=running?ov*(.4+.6*fs[i]):f;foul[i]+=(t-f)*dt*(t>f?.15:.03)});
  avgF=foul.reduce((a,b)=>a+b,0)/foul.length;mf=running&&avgF>.03&&Math.random()<avgF*.35;
  const bt=running&&e.boost?e.boost*thr*sst(e.spool[0],e.spool[1],rpm):0;
  boost+=(bt-boost)*(1-Math.exp(-dt/(bt>boost?e.lag:.25)));
  if(e.boost&&prevThr>.4&&thr<.4&&tgt<.15&&boost>6&&running)puff(2500,.22,.45);
  const fric=e.k*(.12+.3*rpm/e.red)*(1-.5*thr),ld=gear?1/(1+.25/(GR[gear-1]**2)):1;let T=0,T0=0;

  else{
    if(running){if(rpm>=e.red)cut=true;else if(rpm<e.red-250)cut=false;
      T0=cut||mf?0:tq(e,rpm,boost)*thr*(1-.7*avgF);T=T0+Math.min(e.k*.5,Math.max(0,(e.idle-rpm)*e.k*.004))*(1-.5*avgF)}

  else if(!dead)strain=Math.max(0,strain-dt*1.5);
  shk=dead?shk*Math.exp(-dt*3):(strain>LIM*.6?(strain/LIM-.6)*5:0);flash=Math.max(0,flash-dt*2.5);
}

/* ---------- 3D ---------- */
const cvs=$('#c'),ren=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true}),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,200);
ren.setPixelRatio(Math.min(2,devicePixelRatio||1));
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,.9));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(5,9,7);scene.add(sun);
const lamp=new THREE.PointLight(0xffaa55,0,30);lamp.position.set(0,2,0);scene.add(lamp);
const grid=new THREE.GridHelper(40,40,0x889099,0x4a545c);grid.position.y=-3.4;scene.add(grid);
const GL={transparent:true,opacity:.28,depthWrite:false,side:THREE.DoubleSide};
const mk=(g,c,o)=>new THREE.Mesh(g,new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.5,roughness:.45},o||{})));
function gear3(r,N,w,c){const s=new THREE.Shape();for(let i=0;i<N*4;i++){const a=i/(N*4)*6.2832,q=i%4<2?r*1.12:r,x=q*Math.cos(a),y=q*Math.sin(a);i?s.lineTo(x,y):s.moveTo(x,y)}
  const g=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:false});g.translate(0,0,-w/2);g.rotateY(Math.PI/2);return mk(g,c)}

const UP=new THREE.Vector3(0,1,0);
const LG=(()=>{const s=new THREE.Shape();for(let i=0;i<48;i++){const a=i/48*6.2832,r=.12+.11*Math.pow(Math.max(0,Math.cos(a)),4),x=r*Math.sin(a),y=r*Math.cos(a);i?s.lineTo(x,y):s.moveTo(x,y)}const g=new THREE.ExtrudeGeometry(s,{depth:.2,bevelEnabled:false});g.translate(0,0,-.1);g.rotateY(Math.PI/2);return g})();
function pipe(a,b,r,c){const d=b.clone().sub(a),m=mk(new THREE.CylinderGeometry(r,r,d.length(),10),c);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(UP,d.normalize());G.add(m);return m}
let G=new THREE.Group(),P=[],RT=[],TB=[],GI=[],GO=[],CP=[],BF,HM,oilM,fw,pn,osh,sh2,bn,sa=0,ssp=0,hit=0;
function build3D(){
  scene.remove(G);PR.forEach(p=>scene.remove(p.ms));PR=[];proj=null;G=new THREE.Group();scene.add(G);P=[];RT=[];TB=[];GI=[];GO=[];CP=[];
  const e=cur,n=e.n,pit=e.rot?1.5:e.flat?1.3:1.05,len=n*pit,bx=i=>(i-(n-1)/2)*pit;e.len=len;
  foul=Array(n*e.b.length).fill(0);fs=foul.map(Math.random);

  const sh=mk(new THREE.CylinderGeometry(.16,.16,len+.6,16),0x999999);sh.rotation.z=Math.PI/2;G.add(sh);
  const cc=mk(new THREE.BoxGeometry(len+.2,.8,1.5),0x7c8791,GL);cc.position.y=-.2;G.add(cc);
  const pan=mk(new THREE.BoxGeometry(len+.2,.5,1.3),0x55606a,GL);pan.position.y=-.85;G.add(pan);

  if(e.rot){
    for(let i=0;i<n;i++){const g=new THREE.Group();g.position.x=bx(i);G.add(g);
      const h=mk(new THREE.CylinderGeometry(1.1,1.1,.9,40),0x8a97a3,GL);h.rotation.z=Math.PI/2;g.add(h);
      const sp=new THREE.Shape();for(let k=0;k<3;k++){const a=k*2.0944+1.5708,x=.85*Math.cos(a),y=.85*Math.sin(a);k?sp.lineTo(x,y):sp.moveTo(x,y)}
      const rg=new THREE.ExtrudeGeometry(sp,{depth:.6,bevelEnabled:false});rg.translate(0,0,-.3);rg.rotateY(Math.PI/2);

  $('#oilv').textContent=oil+'%'+(oil<10?' (empty)':oil>110?' (overfilled)':oil>=90?' (full)':' (low)');
  $('#sBar').style.width=Math.min(100,strain/LIM*100)+'%';
  $('#sTxt').textContent=dead?'Engine destroyed. Rebuild it to try again.':'Strain '+strain.toFixed(1)+' of '+LIM.toFixed(0)+' s at full throttle.'+(oil<4?' No oil: it will seize in about 5 s.':'')+(avgF>.02?' Spark plugs fouled '+Math.round(avgF*100)+'%.':'');
}
list();build3D();
let last=performance.now();
(function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);audio();update3D(dt);ui();frame3D();requestAnimationFrame(frame)})(last);
</script>
</body>
